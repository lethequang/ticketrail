name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ticketrail doctor`
      description: Run it from the workspace. It prints paths and counts only, no session content.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version, ticketrail version
      placeholder: "macOS 15.3, Python 3.13, ticketrail 0.1.1"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not paste session transcripts, prompts or secrets.
          required: true
